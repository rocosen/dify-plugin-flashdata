identity:
  name: youtube_transcript
  author: flashdata-dev
  label:
    en_US: YouTube Transcript
description:
  human:
    en_US: Retrieve existing timestamped subtitles and full text in a selected language.
      Defaults to automatically generated captions. No speech recognition, translation
      or silent fallback to another track.
  llm: Retrieve existing timestamped subtitles and full text in a selected language.
    Defaults to automatically generated captions. No speech recognition, translation
    or silent fallback to another track.
parameters:
- name: video_id
  type: string
  required: true
  label:
    en_US: Video id
  human_description:
    en_US: An 11-character video ID or youtube.com / youtu.be video URL; parsed locally
      to an ID.
  llm_description: An 11-character video ID or youtube.com / youtu.be video URL; parsed
    locally to an ID.
  form: llm
- name: language
  type: string
  required: false
  label:
    en_US: Language
  human_description:
    en_US: Caption or suggestions language, such as en or zh-CN.
  llm_description: Caption or suggestions language, such as en or zh-CN.
  form: llm
  default: en
- name: auto
  type: boolean
  required: false
  label:
    en_US: Auto
  human_description:
    en_US: true selects automatic captions; false selects manual uploader captions.
      No fallback.
  llm_description: true selects automatic captions; false selects manual uploader
    captions. No fallback.
  form: llm
  default: true
extra:
  python:
    source: tools/youtube_transcript.py
