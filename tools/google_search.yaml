identity:
  name: google_search
  author: flashdata-dev
  label:
    en_US: Google Search
description:
  human:
    en_US: Search Google with FlashData and return ranked links, titles, snippets
      and available search features.
  llm: Search Google with FlashData and return ranked links, titles, snippets and
    available search features.
parameters:
- name: query
  type: string
  required: true
  label:
    en_US: Search query
  human_description:
    en_US: Search terms, between 1 and 2,000 characters. Do not include secrets or
      unnecessary personal data.
  llm_description: Search terms, between 1 and 2,000 characters. Do not include secrets
    or unnecessary personal data.
  form: llm
- name: num
  type: number
  required: false
  label:
    en_US: Result count
  human_description:
    en_US: Requested number of results, 1-100.
  llm_description: Requested number of results, 1-100.
  form: llm
  default: 10
  min: 1
  max: 100
- name: page
  type: number
  required: false
  label:
    en_US: Page
  human_description:
    en_US: Search page, 1-100.
  llm_description: Search page, 1-100.
  form: llm
  default: 1
  min: 1
  max: 100
- name: gl
  type: string
  required: false
  label:
    en_US: Country code
  human_description:
    en_US: Optional two-letter country code, such as us.
  llm_description: Optional two-letter country code, such as us.
  form: llm
- name: hl
  type: string
  required: false
  label:
    en_US: Language code
  human_description:
    en_US: Optional language code, such as en.
  llm_description: Optional language code, such as en.
  form: llm
- name: location
  type: string
  required: false
  label:
    en_US: Search location
  human_description:
    en_US: Optional broad search location, up to 200 characters. Do not enter precise
      personal location.
  llm_description: Optional broad search location, up to 200 characters. Do not enter
    precise personal location.
  form: llm
- name: tbs
  type: string
  required: false
  label:
    en_US: Time filter
  human_description:
    en_US: Optional Google time filter, such as qdr:w for the past week, up to 200
      characters.
  llm_description: Optional Google time filter, such as qdr:w for the past week, up
    to 200 characters.
  form: llm
- name: autocorrect
  type: boolean
  required: false
  label:
    en_US: Autocorrect
  human_description:
    en_US: Whether to autocorrect the search query.
  llm_description: Whether to autocorrect the search query.
  form: llm
  default: true
extra:
  python:
    source: tools/google_search.py
