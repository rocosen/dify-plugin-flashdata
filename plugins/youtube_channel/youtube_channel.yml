app:
  description: Uses the independent YouTube Channel Data plugin (flashdata-dev/youtube_channel
    0.1.1). Configure its provider credential before running.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: YouTube Channel Data — Youtube Channel
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-flashdata
      source: start
      target: flashdata
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: tool
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: flashdata-end
      source: flashdata
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: tool
        targetType: end
        isInIteration: false
        isInLoop: false
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Handle
          variable: handle
          type: text-input
          required: true
          max_length: 200
          options: []
      height: 90
      id: start
      position:
        x: 30
        y: 227
      positionAbsolute:
        x: 30
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: tool
        title: YouTube Channel Data
        desc: Retrieve a YouTube channel profile and recent videos using its handle.
          Request 1–100 videos; returned fields and count depend on upstream availability.
        provider_id: flashdata-dev/youtube_channel/youtube_channel
        provider_name: flashdata-dev/youtube_channel/youtube_channel
        provider_type: builtin
        tool_name: youtube_channel
        tool_label: YouTube Channel Data
        tool_configurations: {}
        tool_node_version: '2'
        tool_parameters:
          handle:
            type: mixed
            value: '{{#start.handle#}}'
          video_limit:
            type: constant
            value: 10
        is_team_authorization: true
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
      height: 90
      id: flashdata
      position:
        x: 340
        y: 227
      positionAbsolute:
        x: 340
        y: 227
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - flashdata
          - json
          value_type: array[object]
          variable: results
        selected: true
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 650
        y: 227
      positionAbsolute:
        x: 650
        y: 227
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
